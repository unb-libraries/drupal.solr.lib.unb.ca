dockworker:
  version: '6'
  application:
    name: Solr Instance for Drupal Applications at UNB Libraries
    uri: https://drupal.solr.lib.unb.ca
    description: >
      A Solr instance for use with Drupal applications at UNB Libraries.
    topics:
      - solr
      - drupal
    identifiers:
      id: drupal.solr.lib.unb.ca
      slug: drupal-solr-lib-unb-ca
      short_slug: drupsolr
      uuid: 3500
    framework:
      name: Solr
      version: 7
      startup_finished_marker: 'o.e.j.s.Server Started'
      endpoint:
        name: http
        port: 8983
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  endpoints:
    env:
      - dev
      - prod
    deployments:
      drupal-solr-lib-unb-ca:
        default: true
        managed: true
        name: drupal-solr-lib-unb-ca
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: drupal.solr.lib.unb.ca
    jira:
      project_keys:
        - IN
    image:
      name: ghcr.io/unb-libraries/drupal.solr.lib.unb.ca
      parent: solr:8.4
      repository: GitHub
      push-branches:
        - dev
        - prod
